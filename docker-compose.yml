# ═══════════════════════════════════════════════════════════════════════════════
# Logistics & Fleet Management Platform — Docker Compose
# Local demo / presentation environment
# ═══════════════════════════════════════════════════════════════════════════════
# Usage:
#   1. Copy .env.docker to .env and fill in your Entra ID values
#   2. docker compose up --build
#   3. Open http://localhost:3000
#   4. View caught emails at http://localhost:8025
# ═══════════════════════════════════════════════════════════════════════════════

services:

  # ── SQL Server 2022 Express ─────────────────────────────────────────────────
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: logistics-db
    environment:
      SA_PASSWORD: "${SQL_SA_PASSWORD}"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test: >
        /bin/bash -c "
        /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$SA_PASSWORD\" -C -Q 'SELECT 1' 2>/dev/null ||
        /opt/mssql-tools/bin/sqlcmd  -S localhost -U sa -P \"$$SA_PASSWORD\" -Q 'SELECT 1' 2>/dev/null
        "
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s
    networks:
      - logistics-net

  # ── Azure Storage Emulator (Blob + Queue) ───────────────────────────────────
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: logistics-storage
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --loose
    ports:
      - "10000:10000"   # Blob Storage
      - "10001:10001"   # Queue Storage
      - "10002:10002"   # Table Storage (not used but exposed)
    volumes:
      - azurite-data:/data
    networks:
      - logistics-net

  # ── MailHog — catches all outgoing email for demo inspection ─────────────────
  mailhog:
    image: mailhog/mailhog:latest
    container_name: logistics-mail
    ports:
      - "1025:1025"   # SMTP (API sends to this)
      - "8025:8025"   # Web UI — open http://localhost:8025 to read emails
    networks:
      - logistics-net

  # ── .NET 8 Web API ──────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: src/api/Dockerfile
    container_name: logistics-api
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:8080

      # Database — points to the db service above
      Sql__ConnectionString: "Server=db,1433;Database=logistics-db;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True;Connection Timeout=30;"

      # Azure Storage Emulator (Azurite)
      Storage__ConnectionString: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;"

      # Azure Entra ID — your real tenant, with localhost redirect URI
      EntraId__TenantId: "${ENTRA_TENANT_ID}"
      EntraId__ClientId: "${ENTRA_API_CLIENT_ID}"

      # Email — MailHog SMTP (no auth, no TLS needed locally)
      Email__SmtpHost: mailhog
      Email__SmtpPort: "1025"
      Email__UseSsl: "false"
      Email__FromAddress: "noreply@logistics-demo.local"
      Email__FromName: "Logistics Platform (Demo)"

      # Seed demo data on first startup
      Demo__SeedOnStartup: "true"

    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      azurite:
        condition: service_started
      mailhog:
        condition: service_started
    networks:
      - logistics-net
    restart: on-failure

  # ── React Frontend (Nginx) ───────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: src/web/Dockerfile
      args:
        # Baked into the React bundle at build time
        VITE_API_BASE_URL: "http://localhost:8080/api"
        VITE_ENTRA_CLIENT_ID: "${ENTRA_WEB_CLIENT_ID}"
        VITE_ENTRA_TENANT_ID: "${ENTRA_TENANT_ID}"
        VITE_ENTRA_API_SCOPE: "api://${ENTRA_API_CLIENT_ID}/Logistics.Access"
    container_name: logistics-web
    ports:
      - "3000:80"
    depends_on:
      - api
    networks:
      - logistics-net

# ── Named Volumes ──────────────────────────────────────────────────────────────
volumes:
  sql-data:
    name: logistics-sql-data
  azurite-data:
    name: logistics-azurite-data

# ── Network ────────────────────────────────────────────────────────────────────
networks:
  logistics-net:
    name: logistics-network
    driver: bridge
