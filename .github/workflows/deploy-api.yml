# ═══════════════════════════════════════════════════════════════════════════════
# Desicon Logistics — API Deployment Pipeline
# Triggers on: push to main branch (src/api/** changes)
#
# Required GitHub Secrets:
#   AZURE_CREDENTIALS       — Service principal JSON (az ad sp create-for-rbac output)
#   AZURE_APP_SERVICE_NAME  — e.g. app-deslogistics-api-prod-abc123
#   AZURE_RESOURCE_GROUP    — e.g. rg-desicon-logistics-prod
# ═══════════════════════════════════════════════════════════════════════════════

name: Deploy API to Azure App Service

on:
  push:
    branches: [main]
    paths:
      - 'src/api/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:   # Allow manual trigger from GitHub Actions UI

env:
  DOTNET_VERSION: '8.0.x'
  PROJECT_PATH: 'src/api/LogisticsApi.csproj'
  BUILD_CONFIGURATION: 'Release'

jobs:
  build-and-deploy:
    name: Build & Deploy .NET 8 API
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ──────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Setup .NET ────────────────────────────────────────────────────────────
      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # ── Restore dependencies ──────────────────────────────────────────────────
      - name: Restore NuGet packages
        run: dotnet restore ${{ env.PROJECT_PATH }}

      # ── Build & Publish ───────────────────────────────────────────────────────
      # Combined into one step to ensure the correct .NET 8 SDK is used throughout.
      # Separating build + publish --no-build can cause the runner's system dotnet
      # (now .NET 10 on ubuntu-latest) to be invoked instead of the pinned SDK.
      - name: Publish
        run: |
          dotnet publish ${{ env.PROJECT_PATH }} \
            --configuration ${{ env.BUILD_CONFIGURATION }} \
            --no-restore \
            --output ./publish

      # ── Login to Azure ────────────────────────────────────────────────────────
      - name: Login to Azure
        id: azure-login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # ── Deploy to App Service ─────────────────────────────────────────────────
      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_APP_SERVICE_NAME }}
          package: ./publish

      # ── Verify health endpoint ────────────────────────────────────────────────
      # On first deployment EF Core runs all migrations before serving requests.
      # Retry up to 10 times (every 15s = up to 2.5 minutes total wait).
      - name: Health check with retry
        run: |
          URL="https://${{ secrets.AZURE_APP_SERVICE_NAME }}.azurewebsites.net/health"
          echo "Waiting for API to become healthy at $URL"
          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || echo "000")
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "✅ API is healthy"
              exit 0
            fi
            echo "Not ready yet — waiting 15s..."
            sleep 15
          done
          echo "❌ API did not become healthy after 150s"
          exit 1

      # ── Logout ────────────────────────────────────────────────────────────────
      - name: Logout from Azure
        run: az logout
        if: steps.azure-login.outcome == 'success'
